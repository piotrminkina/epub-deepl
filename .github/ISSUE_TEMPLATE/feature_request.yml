name: Feature request
description: Suggest a new capability or a change in behaviour.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before opening: scan
        [`docs/plans/prd.md`](../../blob/master/docs/plans/prd.md)
        and the [out-of-scope section](../../blob/master/README.md#out-of-scope)
        to make sure the feature isn't deliberately excluded.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow does the missing feature block?
      placeholder: |
        I want to translate a fixed-layout EPUB with media overlays
        (synchronized narration audio). Currently the tool rejects it
        at the validator step.
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: Optional. If you have a specific shape in mind, sketch it.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Are there existing tools or workarounds that partially solve this?
        E.g. `bilingual_book_maker`, `Sigil` merge/split, manual editing.
    validations:
      required: false
